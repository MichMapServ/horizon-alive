# No fake HUD explosion: integration smoke checks for Horizon .hmod sandbox.
[[step]]
command = "alive status"
expect.feedback = "Alive: on; quality: balanced; motion: normal; HUD particles: removed; 3D TNT: native required"

[[step]]
command = "alive demo boom"
expect.error = "2D effects removed; .hmod cannot render world-space explosions"

[[step]]
command = "alive graphics off"
expect.feedback = "HUD particle renderer permanently disabled"

[[step]]
command = "alive graphics on"
expect.error = "2D effects removed; .hmod cannot render world-space explosions"

[[step]]
command = "alive quality high"
expect.feedback = "Target quality: high"

[[step]]
command = "alive motion reduced"
expect.feedback = "Camera motion preference: reduced"

[[step]]
command = "alive off"
expect.feedback = "Explosion preference disabled"

[[step]]
reload = true
command = "alive status"
expect.feedback = "Alive: off; quality: high; motion: reduced; HUD particles: removed; 3D TNT: native required"

[[step]]
command = "alive on"
expect.feedback = "Explosion preference enabled; native 3D renderer required"

[[step]]
frames = 60
ticks = 20
expect.panel = []
