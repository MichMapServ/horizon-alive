name: Build Horizon Alive hmod
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Horizon packaging tool
        run: cargo install --git https://github.com/horizon-rust/horizon --tag v0.2.92 cargo-horizon-mod
      - name: Formatting
        run: |
          cargo fmt --all
          cargo fmt --all --check
      - name: Rust tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build .hmod
        run: cargo horizon-mod build
      - name: Verify .hmod sandbox
        run: cargo horizon-mod check target/horizon-mod/horizon_alive.hmod
      - name: Package integrity
        run: test -s target/horizon-mod/horizon_alive.hmod && sha256sum target/horizon-mod/horizon_alive.hmod
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-alive-0.3.3-hmod
          path: target/horizon-mod/horizon_alive.hmod
          if-no-files-found: error
